# ====== Example: maple VM (wingpu) ======
# Run (in the VM's script container):
#   cd /work/MapleStoryAutoLevelUp && /work/venv-msbot/bin/python -m src.engine.MapleStoryAutoLevelUp --cfg wingpu_maple
# Everything below marked CONFIRM needs the player's input before going live.

system:
  platform: "wingpu"

bot:
  mode: "normal"
  attack: "directional"
  map: "gon_pig"            # 弓箭手村東部草叢 (where the character stood on 2026-10-31)

key:
  # Confirmed by the player (2026-11-02): Ctrl = attack, Del = red potion (HP), End = blue potion (MP).
  # bot.attack is "directional", so the attack key is directional_attack.
  directional_attack: "ctrl"
  add_hp: "delete"
  add_mp: "end"
  jump: "alt"               # confirmed by the player
  teleport: ""              # not used (archer); "" = the bot jumps where a route says teleport
  # CONFIRM: still copied from config_gun.yaml, not confirmed by the player.
  party: "p"
  return_home: "home"

buff_skill:
  keys: []                  # CONFIRM: config_gun.yaml has ['1', 'a', 'x'] with [600, 300, 300] s
  cooldown: []

directional_attack:
  cooldown: 0.1
  range_x: 250

health_monitor:
  add_hp_percent: 20
  add_mp_percent: 30

monster_detect:
  search_box_margin: 80

channel_change:
  enable: False             # it clicks menus; keep off until live input is approved

wingpu:
  dry_run: True             # CONFIRM: set False (or run with --wingpu_live) only after approval
  debug_interval: 1         # the web UI refreshes every second
  http_port: 8765           # web UI + status / debug.jpg / mjpeg (container network; wgsd proxies /app/maple/)
