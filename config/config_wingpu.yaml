# ====== wingpu Configuration ======
# Used when the game runs inside a wingpu VM and the bot runs in that VM's
# script container (or anywhere with the wingpu SDK). Applied after
# config_default.yaml and before config_<your cfg>.yaml, so override any of
# these in your own config. See README.wingpu.md.

system:
  platform: "wingpu"
  fps_limit_window_capturor: 10 # read the guest screen as often as the main loop runs (upstream 15)
  opencv_threads: 1         # OpenCV thread pool size (1: same speed, 1/3 of the CPU on these image sizes)

wingpu:
  # 🛑 Dry run: log every key/mouse action the bot WOULD send, send nothing.
  # Turning it off needs `dry_run: false` in YOUR config or --wingpu_live.
  dry_run: True

  # 🪟 Where the game client is in the guest screen (guest pixels)
  detect: "auto"            # "auto" | "fixed" | "template" | "fullscreen"
                            #  auto: client_rect if set, else title_template if it matches, else fullscreen
  client_rect: []           # [x, y, w, h] fixed client area (excluding the title bar)
  title_template: ""        # image of the window title bar (tools/wingpu_calibrate.py writes it)
  title_thres: 0.05         # TM_SQDIFF_NORMED threshold for the title template (lower = stricter)
  title_to_client: [0, 0]   # offset from the template's top-left to the client's top-left
  client_size_guest: []     # [w, h] client size in guest pixels when found by the template ([] = to the screen edge)
  redetect_interval: 5      # seconds between client re-detection (window moved / resized)

  # 📐 The bot works on the client 1:1 (no resize). Templates and pixel settings
  # were made for the upstream 1296x700 frame and are scaled to the real frame:
  scale: "auto"             # "auto" (= frame width / 1296) | "height" | "geometric" | a number
  ensure_party_on_start: False # upstream opens the party window (P) at start; off: it acts before detecting anything

  # 🎛️ Control and debug output (default directory: /work in the container, else .)
  start_running: True       # bot acts at start when there is no control file
  control_file: ""          # default <dir>/control.json: {"run": true|false} or {"quit": true}
  debug_dir: ""             # default <dir>/debug: latest.png, latest_guest.jpg, status.json
  debug_interval: 2         # seconds between debug outputs (latest.jpg, status.json)
  debug_png: False          # also write latest.png (full-size PNG, ~10x the CPU of the JPEG)
  http_port: 0              # >0: status / debug.png / mjpeg / run / pause on this port

  # 🌐 Only outside the script container (network API of the wingpu manager)
  url: ""
  vm: ""
  token: ""

monster_detect:
  # Measured 2026-11-02 on 46 hunting frames from maple (1366x768, pigs):
  # - contour_only (upstream default) matches tree trunks, text and the hotkey
  #   panel as well as pigs (the game draws sprites ~1.05x, filtered, so outlines
  #   are not exact black any more); real pigs did not score better than those.
  # - color at 1/2 size, diff_thres 0.14 + a texture check: 23 of 25 hits are
  #   pigs (the 2 others: a portal, a tree trunk); real pigs score 0.10-0.14,
  #   flat sky/mountain areas 0.14-0.16 (hence color_min_std).
  mode: "color"
  diff_thres: 0.14
  color_min_std: 30         # grey std-dev a match must have (flat background has 11-36, pigs 33-87)
  black_thres: 30           # contour_only: outline pixel = every channel <= this (0 = exact black, upstream)
  match_downscale: 2        # template matching at 1/2 size (contour_only, color)
  color_prefilter: True     # color: match at 1/4 first, then only around candidates (same hits on the fixtures, ~half the CPU)
  color_prefilter_thres: 0.16
  interval_frames: 2        # look for monsters every 2nd frame (5/s at fps_limit_main 10), reuse the result in between
  # Where to look (2026-11-02, 49 hunting frames, colour mode): roi (400/400/150/150 around the player)
  # 31 hits, 2 false, 20 ms/frame; full (whole camera area) 139 hits, ~69 false (sky + foliage), 129 ms/frame
  search: "roi"

player_detect:
  # party_bar (default): the party HP bar only. nametag / auto (party bar, then
  # nametag) are opt-in in the web UI and need a nametag template (截取名牌).
  mode: "party_bar"

rune_find:
  # Rune messages / rune / arrow mini-game are not verified at wingpu
  # resolutions (no frames with a rune yet): off until switched on in the web UI.
  enable: False

watchdog:
  # "no attack for last_attack_timeout s -> change channel / go home": opt-in
  last_attack_enable: False
