<title>Ston 即時地圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #1a1a2e; --bg2: #16213e; --fg: #e0e0e0; --fg2: #8a8a9a;
    --platform: #22c55e; --rope: #38bdf8; --player: #facc15;
    --accent: #a78bfa; --danger: #ef4444;
    --font: 'JetBrains Mono', 'Fira Code', monospace;
    --font-ui: system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f0f1a; --bg2: #1a1a2e; --fg: #e8e8f0; --fg2: #7a7a8e;
    color-scheme: dark;
  }}
  :root[data-theme="dark"] {
    --bg: #0f0f1a; --bg2: #1a1a2e; --fg: #e8e8f0; --fg2: #7a7a8e;
    color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    margin: 0; padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  h1 { font-family: var(--font); font-size: 1.2rem; font-weight: 600; margin: 0; }
  h1 span { color: var(--accent); }
  .status-bar {
    display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.8rem;
    font-family: var(--font); color: var(--fg2);
  }
  .status-bar b { color: var(--fg); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .dot.live { background: #22c55e; animation: pulse 1s infinite; }
  .dot.off { background: #ef4444; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
  .canvas-wrap {
    position: relative; background: var(--bg2); border-radius: 10px;
    padding: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    max-width: 100%; overflow: hidden;
  }
  canvas { display: block; image-rendering: pixelated; max-width: 100%; height: auto; }
  .hover-info {
    position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.75);
    font-family: var(--font); font-size: 0.7rem; padding: 3px 8px;
    border-radius: 4px; pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .controls label {
    display: flex; align-items: center; gap: 4px; font-size: 0.75rem;
    font-family: var(--font); cursor: pointer; user-select: none;
    background: var(--bg2); padding: 4px 10px; border-radius: 5px;
  }
  .controls input[type=checkbox] { accent-color: var(--accent); }
  .btn {
    background: var(--accent); color: #fff; border: none; padding: 4px 12px;
    border-radius: 5px; font-family: var(--font); font-size: 0.75rem; cursor: pointer;
  }
  .btn:hover { opacity: 0.85; }
  .btn.danger { background: var(--danger); }
  .info-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 6px; width: 100%; max-width: 700px; font-size: 0.75rem;
  }
  .info-card {
    background: var(--bg2); border-radius: 6px; padding: 6px 8px;
    border-left: 3px solid var(--platform); font-family: var(--font);
  }
  .info-card.rope { border-left-color: var(--rope); }
  .info-card h3 { margin: 0; font-size: 0.8rem; }
  .info-card p { margin: 2px 0 0; color: var(--fg2); font-variant-numeric: tabular-nums; }
  #api-input { background: var(--bg2); border: 1px solid #333; color: var(--fg);
    font-family: var(--font); font-size: 0.75rem; padding: 4px 8px; border-radius: 5px; width: 220px; }
</style>

<h1><span>LIVE</span> 地圖軌跡</h1>

<div class="controls">
  <label>API: <input id="api-input" value="http://10.231.0.45:8765" placeholder="http://container_ip:8765"></label>
  <button class="btn" id="btn-connect">連線</button>
  <button class="btn danger" id="btn-clear">清除軌跡</button>
  <label><input type="checkbox" id="cb-plat" checked> 平台</label>
  <label><input type="checkbox" id="cb-rope" checked> 繩索</label>
  <label><input type="checkbox" id="cb-trail" checked> 軌跡</label>
  <label><input type="checkbox" id="cb-labels" checked> 標籤</label>
</div>

<div class="status-bar">
  <span><span class="dot off" id="dot"></span><span id="conn-status">未連線</span></span>
  <span>座標: <b id="pos-text">—</b></span>
  <span>軌跡: <b id="trail-count">0</b> 點</span>
  <span>平台: <b id="plat-count">0</b></span>
  <span>繩索: <b id="rope-count">0</b></span>
</div>

<div class="canvas-wrap">
  <canvas id="cv"></canvas>
  <div class="hover-info" id="hover">x: — y: —</div>
</div>

<div class="info-grid" id="info-grid"></div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const S = 3;

let mapW = 187, mapH = 191;
let trail = [];
let platforms = [];
let ropes = [];
let polling = null;
let lastPos = null;

function resizeCanvas() {
  cv.width = mapW * S;
  cv.height = mapH * S;
}
resizeCanvas();

// Try to get API URL from the page's own URL params or localStorage
try {
  const saved = localStorage.getItem('minimap_api');
  if (saved) document.getElementById('api-input').value = saved;
} catch(e) {}

document.getElementById('btn-connect').onclick = () => {
  const url = document.getElementById('api-input').value.trim();
  if (!url) return;
  try { localStorage.setItem('minimap_api', url); } catch(e) {}
  if (polling) clearInterval(polling);
  startPolling(url);
};

document.getElementById('btn-clear').onclick = () => {
  trail = [];
  platforms = [];
  ropes = [];
  draw();
  updateInfo();
};

function startPolling(baseUrl) {
  const dot = document.getElementById('dot');
  const status = document.getElementById('conn-status');

  async function poll() {
    try {
      const r = await fetch(baseUrl + '/status', {signal: AbortSignal.timeout(2000)});
      const d = await r.json();
      const mm = d.minimap;
      if (!mm || !mm.found) {
        dot.className = 'dot off';
        status.textContent = '找不到小地圖';
        return;
      }

      dot.className = 'dot live';
      status.textContent = '即時';

      // Update map size if changed
      if (mm.size_wh && (mm.size_wh[0] !== mapW || mm.size_wh[1] !== mapH)) {
        mapW = mm.size_wh[0];
        mapH = mm.size_wh[1];
        resizeCanvas();
      }

      const pos = mm.player_on_minimap;
      if (pos) {
        lastPos = {x: pos[0], y: pos[1]};
        document.getElementById('pos-text').textContent = `${pos[0]}, ${pos[1]}`;

        // Add to trail (skip if same as last)
        const last = trail[trail.length - 1];
        if (!last || last[0] !== pos[0] || last[1] !== pos[1]) {
          trail.push([pos[0], pos[1]]);
          document.getElementById('trail-count').textContent = trail.length;

          // Re-analyze every 20 new points
          if (trail.length % 20 === 0) {
            analyzePlatforms();
          }
        }
      }

      draw();
    } catch(e) {
      dot.className = 'dot off';
      status.textContent = '連線失敗';
    }
  }

  poll();
  polling = setInterval(poll, 500);
}

function analyzePlatforms() {
  if (trail.length < 10) return;

  const platY = {};
  const ropeX = {};

  for (let i = 1; i < trail.length; i++) {
    const [x0,y0] = trail[i-1];
    const [x1,y1] = trail[i];
    const dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);

    if (dy <= 1 && dx >= 1) {
      platY[y0] = (platY[y0]||0) + 1;
      platY[y1] = (platY[y1]||0) + 1;
    }
    if (dx <= 2 && dy >= 2) {
      ropeX[x0] = (ropeX[x0]||0) + 1;
      ropeX[x1] = (ropeX[x1]||0) + 1;
    }
  }

  // Cluster platform Y values
  const yVals = Object.entries(platY)
    .filter(([_,c]) => c >= 3)
    .map(([y,c]) => [parseInt(y), c])
    .sort((a,b) => a[0]-b[0]);

  const yGroups = [];
  for (const [y, c] of yVals) {
    const last = yGroups[yGroups.length - 1];
    if (last && y - last[last.length-1][0] <= 4) {
      last.push([y, c]);
    } else {
      yGroups.push([[y, c]]);
    }
  }

  platforms = yGroups.map((g, idx) => {
    const yMean = Math.round(g.reduce((s,[y])=>s+y,0) / g.length);
    const ys = new Set(g.map(([y])=>y));
    const xs = trail.filter(p => ys.has(p[1])).map(p => p[0]);
    return {
      y: yMean,
      x0: xs.length ? Math.min(...xs) : 0,
      x1: xs.length ? Math.max(...xs) : mapW,
      label: `P${idx+1}`,
      samples: g.reduce((s,[_,c])=>s+c,0),
    };
  });

  // Cluster rope X values
  const xVals = Object.entries(ropeX)
    .filter(([_,c]) => c >= 2)
    .map(([x,c]) => [parseInt(x), c])
    .sort((a,b) => a[0]-b[0]);

  const xGroups = [];
  for (const [x, c] of xVals) {
    const last = xGroups[xGroups.length - 1];
    if (last && x - last[last.length-1][0] <= 4) {
      last.push([x, c]);
    } else {
      xGroups.push([[x, c]]);
    }
  }

  ropes = xGroups.map((g, idx) => {
    const xMean = Math.round(g.reduce((s,[x])=>s+x,0) / g.length);
    const xs = new Set(g.map(([x])=>x));
    const ys = trail.filter(p => xs.has(p[0])).map(p => p[1]);
    return {
      x: xMean,
      yt: ys.length ? Math.min(...ys) : 0,
      yb: ys.length ? Math.max(...ys) : mapH,
      label: `R${idx+1}`,
    };
  });

  document.getElementById('plat-count').textContent = platforms.length;
  document.getElementById('rope-count').textContent = ropes.length;
  updateInfo();
}

function updateInfo() {
  const grid = document.getElementById('info-grid');
  let html = '';
  for (const p of platforms) {
    html += `<div class="info-card"><h3>${p.label}</h3><p>y=${p.y} x:${p.x0}→${p.x1} (${p.x1-p.x0}px, ${p.samples}樣本)</p></div>`;
  }
  for (const r of ropes) {
    html += `<div class="info-card rope"><h3>${r.label}</h3><p>x=${r.x} y:${r.yt}→${r.yb} (${r.yb-r.yt}px)</p></div>`;
  }
  grid.innerHTML = html;
}

function draw() {
  const showPlat = document.getElementById('cb-plat').checked;
  const showRope = document.getElementById('cb-rope').checked;
  const showTrail = document.getElementById('cb-trail').checked;
  const showLabels = document.getElementById('cb-labels').checked;

  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, cv.width, cv.height);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < mapW; x += 20) {
    ctx.beginPath(); ctx.moveTo(x*S, 0); ctx.lineTo(x*S, mapH*S); ctx.stroke();
  }
  for (let y = 0; y < mapH; y += 20) {
    ctx.beginPath(); ctx.moveTo(0, y*S); ctx.lineTo(mapW*S, y*S); ctx.stroke();
  }

  // Trail
  if (showTrail && trail.length > 1) {
    ctx.strokeStyle = 'rgba(250,204,21,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    trail.forEach(([x,y], i) => {
      if (i === 0) ctx.moveTo(x*S, y*S);
      else ctx.lineTo(x*S, y*S);
    });
    ctx.stroke();

    // Recent 50 dots brighter
    const start = Math.max(0, trail.length - 50);
    for (let i = start; i < trail.length; i++) {
      const t = (i - start) / 50;
      ctx.fillStyle = `rgba(250,204,21,${0.1 + t * 0.5})`;
      ctx.beginPath();
      ctx.arc(trail[i][0]*S, trail[i][1]*S, 2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // Platforms
  if (showPlat) {
    for (const p of platforms) {
      ctx.shadowColor = '#22c55e';
      ctx.shadowBlur = 6;
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(p.x0*S, p.y*S);
      ctx.lineTo(p.x1*S, p.y*S);
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#22c55e';
      ctx.beginPath(); ctx.arc(p.x0*S, p.y*S, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x1*S, p.y*S, 3, 0, Math.PI*2); ctx.fill();

      if (showLabels) {
        ctx.font = 'bold 10px JetBrains Mono, monospace';
        ctx.fillStyle = '#22c55e';
        ctx.textAlign = 'left';
        ctx.fillText(`${p.label} y=${p.y}`, p.x0*S, p.y*S - 6);
      }
    }
  }

  // Ropes
  if (showRope) {
    for (const r of ropes) {
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 4;
      ctx.setLineDash([5, 3]);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r.x*S, r.yt*S);
      ctx.lineTo(r.x*S, r.yb*S);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;

      if (showLabels) {
        ctx.font = 'bold 9px JetBrains Mono, monospace';
        ctx.fillStyle = '#38bdf8';
        ctx.textAlign = 'left';
        ctx.fillText(`${r.label} x=${r.x}`, r.x*S + 4, (r.yt+r.yb)/2*S);
      }
    }
  }

  // Current player position (big bright dot)
  if (lastPos) {
    ctx.shadowColor = '#facc15';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(lastPos.x*S, lastPos.y*S, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Border
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, cv.width, cv.height);
}

// Hover
cv.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  const sx = cv.width / rect.width;
  const sy = cv.height / rect.height;
  const mx = Math.round((e.clientX - rect.left) * sx / S);
  const my = Math.round((e.clientY - rect.top) * sy / S);
  let info = `x: ${mx}  y: ${my}`;
  for (const p of platforms) {
    if (Math.abs(my-p.y) <= 2 && mx >= p.x0 && mx <= p.x1) info += ` · ${p.label}`;
  }
  for (const r of ropes) {
    if (Math.abs(mx-r.x) <= 2 && my >= r.yt && my <= r.yb) info += ` · ${r.label}`;
  }
  document.getElementById('hover').textContent = info;
});

document.querySelectorAll('.controls input[type=checkbox]').forEach(el => el.addEventListener('change', draw));

draw();
</script>
